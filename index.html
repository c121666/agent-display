<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Agent 调度中心大屏</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=JetBrains+Mono:wght@400;500;700;800&family=Michroma&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 外壳 —— 只挂载「调度中心」一块画面（Shadow DOM，样式和 id 独立），页面铺满视口。 */
:root{
  color-scheme:dark;
  --page:#07080d; --sheet:rgba(10,11,16,.96); --sheet-line:#262a39; --sheet-ink:#eef0f7; --sheet-mute:#7d8298;
  --acc:#45e6f5; --acc-2:#ff3f8e; --scrim:rgba(3,4,8,.6);
  --mono:"JetBrains Mono","Noto Sans SC","PingFang SC",ui-monospace,Menlo,monospace;
  --display:"Archivo","Noto Sans SC",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--page);overflow:hidden}
.th-host{position:relative;height:100%}
</style>

<div class="th-host" id="host-ops"></div>
<!-- 调度中心 · OPS 纸面工程（原 Agent Ops 调度大屏） -->
<template id="tpl-ops">
<style>
/* Layout: 纸面工程图式大屏 —— 顶部指标轨 + 圆心偏左的大弧舞台（静止的汇聚连线 / 快速旋转的飞轮：环带数据块 + 外射谱线）+ 底部 2×4 仪表面板。浅色 = 纸与墨，深色 = 夜间荧光绿 */
:host{
  --bg:#eeede8; --panel:#f6f5f1; --band:#eeede8;
  --ink:#151515; --ink2:#4a4a46; --mute:#86857f; --hair:#d2d0c9; --hair2:#e4e2dc;
  --accent:#151515; --bar:#151515; --chip-fg:#f6f5f1; --scan:transparent;
  --c-line:#151515; --c-hi:#000000; --c-hot:#000000; --c-text:#1a1a1a; --c-dim:#7d7c77;
  --font:"JetBrains Mono","Noto Sans SC",ui-monospace,Menlo,monospace;
  --cjk:"Noto Sans SC","JetBrains Mono",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:host(:not([data-theme="light"])){
  --bg:#030605; --panel:#06100c; --band:#040a08;
  --ink:#c3f8e2; --ink2:#5fd6a6; --mute:#4c9f7f; --hair:#143327; --hair2:#0c1f17;
  --accent:#7dffd0; --bar:#5fd6a6; --chip-fg:#03100b; --scan:rgba(125,255,208,.022);
  --c-line:#34d996; --c-hi:#e6fff4; --c-hot:#3dffa6; --c-text:#a6efcf; --c-dim:#3d8f6f;
  color-scheme:dark }}
:host([data-theme="dark"]){
  --bg:#030605; --panel:#06100c; --band:#040a08;
  --ink:#c3f8e2; --ink2:#5fd6a6; --mute:#4c9f7f; --hair:#143327; --hair2:#0c1f17;
  --accent:#7dffd0; --bar:#5fd6a6; --chip-fg:#03100b; --scan:rgba(125,255,208,.022);
  --c-line:#34d996; --c-hi:#e6fff4; --c-hot:#3dffa6; --c-text:#a6efcf; --c-dim:#3d8f6f;
  color-scheme:dark }

/* 主题「炫彩」（2026-10-22）：同一看板的多色配色三套（A 霓虹赛博 / B 极光 / C 全息宝石）。
   暗底荧光感同粒子模式，但谱线 / 高亮 / 热力图按语义分配多色；飞轮 Canvas 读 CSS 变量，自动生效。 */
:host([data-theme="glowA"]){
  --bg:#0a0614; --panel:#150c26; --band:#0e0820;
  --ink:#f3edff; --ink2:#bda8f5; --mute:#7e69b4; --hair:#33245c; --hair2:#241a42;
  --accent:#37d6ff; --bar:#37d6ff; --chip-fg:#0a0614; --scan:rgba(55,214,255,.022);
  --c-line:#7e49b8; --c-hi:#37d6ff; --c-hot:#ff4fd8; --c-text:#cbb6ff; --c-dim:#6b55a8;
  color-scheme:dark }
:host([data-theme="glowB"]){
  --bg:#05141a; --panel:#0a222c; --band:#071c25;
  --ink:#e8fbff; --ink2:#8fd8e8; --mute:#4f8fa6; --hair:#1d4557; --hair2:#123242;
  --accent:#5cffc1; --bar:#5cffc1; --chip-fg:#05141a; --scan:rgba(92,255,193,.022);
  --c-line:#2e97a0; --c-hi:#5cffc1; --c-hot:#ff8cd8; --c-text:#a6e8f2; --c-dim:#3f7d92;
  color-scheme:dark }
:host([data-theme="glowC"]){
  --bg:#0b0b12; --panel:#13131c; --band:#0e0e17;
  --ink:#f2f2f8; --ink2:#a8a8c2; --mute:#6e6e8a; --hair:#2c2c40; --hair2:#1e1e2c;
  --accent:#5ca0ff; --bar:#5ca0ff; --chip-fg:#0b0b12; --scan:rgba(92,160,255,.022);
  --c-line:#4a63c8; --c-hi:#9fc2ff; --c-hot:#b06cff; --c-text:#a8c4ff; --c-dim:#4f5a96;
  color-scheme:dark }
/* 炫彩：热力图色阶改多色渐变（低 → 高：暗 → 主色 → 提亮），选中标签走强调色 */
:host([data-theme="glowA"]) .hm .c.l1{background:rgba(122,73,190,.25)}
:host([data-theme="glowA"]) .hm .c.l2{background:rgba(169,123,255,.45)}
:host([data-theme="glowA"]) .hm .c.l3{background:rgba(55,214,255,.62)}
:host([data-theme="glowA"]) .hm .c.l4{background:rgba(255,79,216,.88)}
:host([data-theme="glowA"]) .su .sw.on{color:var(--accent);border-bottom-color:var(--accent)}
:host([data-theme="glowB"]) .hm .c.l1{background:rgba(46,151,160,.25)}
:host([data-theme="glowB"]) .hm .c.l2{background:rgba(92,200,255,.45)}
:host([data-theme="glowB"]) .hm .c.l3{background:rgba(92,255,193,.62)}
:host([data-theme="glowB"]) .hm .c.l4{background:rgba(255,140,216,.88)}
:host([data-theme="glowB"]) .su .sw.on{color:var(--accent);border-bottom-color:var(--accent)}
:host([data-theme="glowC"]) .hm .c.l1{background:rgba(74,99,200,.25)}
:host([data-theme="glowC"]) .hm .c.l2{background:rgba(92,160,255,.45)}
:host([data-theme="glowC"]) .hm .c.l3{background:rgba(61,224,160,.62)}
:host([data-theme="glowC"]) .hm .c.l4{background:rgba(176,108,255,.88)}
:host([data-theme="glowC"]) .su .sw.on{color:var(--accent);border-bottom-color:var(--accent)}

/* 炫彩 D–I（2026-10-22 全收）：酸性荧光 / 激光 RGB / 迈阿密 / 烈焰熔岩 / 深海荧光 / 虹彩 */
:host([data-theme="glowD"]){
  --bg:#0d0d02; --panel:#17190a; --band:#121306;
  --ink:#f6ffd9; --ink2:#c8e84e; --mute:#8a9436; --hair:#3c4214; --hair2:#262b0c;
  --accent:#d7ff00; --bar:#d7ff00; --chip-fg:#0d0d02; --scan:rgba(215,255,0,.022);
  --c-line:#5a6b12; --c-hi:#d7ff00; --c-hot:#ff2e88; --c-text:#c8e84e; --c-dim:#8a9436;
  color-scheme:dark }
:host([data-theme="glowE"]){
  --bg:#050505; --panel:#0e0e0e; --band:#0a0a0a;
  --ink:#ffffff; --ink2:#c8c8c8; --mute:#787878; --hair:#2e2e2e; --hair2:#1c1c1c;
  --accent:#00ff88; --bar:#00ff88; --chip-fg:#050505; --scan:rgba(0,255,136,.022);
  --c-line:#0080ff; --c-hi:#00ff88; --c-hot:#ff0040; --c-text:#c8c8c8; --c-dim:#787878;
  color-scheme:dark }
:host([data-theme="glowF"]){
  --bg:#170a2c; --panel:#251145; --band:#1e0e3a;
  --ink:#ffe9fb; --ink2:#e29bf5; --mute:#9a6bc4; --hair:#4a2a78; --hair2:#331c58;
  --accent:#ff5fa2; --bar:#ff5fa2; --chip-fg:#170a2c; --scan:rgba(255,95,162,.022);
  --c-line:#6b33a8; --c-hi:#41e2ff; --c-hot:#ff5fa2; --c-text:#e29bf5; --c-dim:#9a6bc4;
  color-scheme:dark }
:host([data-theme="glowG"]){
  --bg:#140503; --panel:#210b06; --band:#1c0705;
  --ink:#ffe9d6; --ink2:#ff9d6b; --mute:#a85f3c; --hair:#4a1c10; --hair2:#2e110a;
  --accent:#ff8a3d; --bar:#ff8a3d; --chip-fg:#140503; --scan:rgba(255,138,61,.022);
  --c-line:#7a2c14; --c-hi:#ffd166; --c-hot:#ff8a3d; --c-text:#ff9d6b; --c-dim:#a85f3c;
  color-scheme:dark }
:host([data-theme="glowH"]){
  --bg:#03101c; --panel:#07202f; --band:#051826;
  --ink:#d9f7ff; --ink2:#6fd6e8; --mute:#3f7d92; --hair:#133b52; --hair2:#0c2a3c;
  --accent:#22f5d8; --bar:#22f5d8; --chip-fg:#03101c; --scan:rgba(34,245,216,.022);
  --c-line:#135270; --c-hi:#22f5d8; --c-hot:#7a5cff; --c-text:#6fd6e8; --c-dim:#3f7d92;
  color-scheme:dark }
:host([data-theme="glowI"]){
  --bg:#0f0c16; --panel:#191325; --band:#140f20;
  --ink:#f6efff; --ink2:#c9a8f0; --mute:#8a6fb0; --hair:#3a2b56; --hair2:#271c3c;
  --accent:#7ee8fa; --bar:#7ee8fa; --chip-fg:#0f0c16; --scan:rgba(126,232,250,.022);
  --c-line:#5b3f8f; --c-hi:#7ee8fa; --c-hot:#ff9ce8; --c-text:#c9a8f0; --c-dim:#8a6fb0;
  color-scheme:dark }
:host([data-theme="glowD"]) .hm .c.l1{background:rgba(90,107,18,.25)}
:host([data-theme="glowD"]) .hm .c.l2{background:rgba(155,189,22,.45)}
:host([data-theme="glowD"]) .hm .c.l3{background:rgba(215,255,0,.62)}
:host([data-theme="glowD"]) .hm .c.l4{background:rgba(255,46,136,.88)}
:host([data-theme="glowD"]) .su .sw.on{color:var(--accent);border-bottom-color:var(--accent)}
:host([data-theme="glowE"]) .hm .c.l1{background:rgba(61,61,61,.25)}
:host([data-theme="glowE"]) .hm .c.l2{background:rgba(107,107,107,.45)}
:host([data-theme="glowE"]) .hm .c.l3{background:rgba(0,255,136,.62)}
:host([data-theme="glowE"]) .hm .c.l4{background:rgba(255,0,64,.88)}
:host([data-theme="glowE"]) .su .sw.on{color:var(--accent);border-bottom-color:var(--accent)}
:host([data-theme="glowF"]) .hm .c.l1{background:rgba(107,51,168,.25)}
:host([data-theme="glowF"]) .hm .c.l2{background:rgba(176,79,216,.45)}
:host([data-theme="glowF"]) .hm .c.l3{background:rgba(65,226,255,.62)}
:host([data-theme="glowF"]) .hm .c.l4{background:rgba(255,95,162,.88)}
:host([data-theme="glowF"]) .su .sw.on{color:var(--accent);border-bottom-color:var(--accent)}
:host([data-theme="glowG"]) .hm .c.l1{background:rgba(122,44,20,.25)}
:host([data-theme="glowG"]) .hm .c.l2{background:rgba(201,84,31,.45)}
:host([data-theme="glowG"]) .hm .c.l3{background:rgba(255,138,61,.62)}
:host([data-theme="glowG"]) .hm .c.l4{background:rgba(255,209,102,.88)}
:host([data-theme="glowG"]) .su .sw.on{color:var(--accent);border-bottom-color:var(--accent)}
:host([data-theme="glowH"]) .hm .c.l1{background:rgba(19,82,112,.25)}
:host([data-theme="glowH"]) .hm .c.l2{background:rgba(30,134,168,.45)}
:host([data-theme="glowH"]) .hm .c.l3{background:rgba(34,245,216,.62)}
:host([data-theme="glowH"]) .hm .c.l4{background:rgba(122,92,255,.88)}
:host([data-theme="glowH"]) .su .sw.on{color:var(--accent);border-bottom-color:var(--accent)}
:host([data-theme="glowI"]) .hm .c.l1{background:rgba(91,63,143,.25)}
:host([data-theme="glowI"]) .hm .c.l2{background:rgba(154,111,216,.45)}
:host([data-theme="glowI"]) .hm .c.l3{background:rgba(126,232,250,.62)}
:host([data-theme="glowI"]) .hm .c.l4{background:rgba(255,156,232,.88)}
:host([data-theme="glowI"]) .su .sw.on{color:var(--accent);border-bottom-color:var(--accent)}

:host{display:block;height:100%;overflow:auto}
[hidden]{display:none!important}
:host{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:11px;-webkit-font-smoothing:antialiased}
.app{min-height:100%;box-sizing:border-box;display:grid;grid-template-rows:minmax(440px,1fr) auto;gap:10px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 顶部指标轨 */
.top{position:absolute;z-index:3;left:0;top:0;display:grid;grid-template-columns:repeat(3,minmax(86px,auto));gap:12px 26px;align-items:end;padding:14px 48px 34px 16px;pointer-events:none;text-shadow:0 0 2px var(--bg),0 0 6px var(--bg),0 0 12px var(--bg);background:radial-gradient(farthest-side at 0 0,color-mix(in srgb,var(--bg) 82%,transparent),color-mix(in srgb,var(--bg) 45%,transparent) 62%,transparent)}
.top .title{grid-column:1 / -1}
.cell{position:relative;min-width:0;padding-bottom:7px;border-bottom:1px solid var(--hair)}
.stat{min-width:86px}
.cell::after{content:"";position:absolute;left:0;bottom:-1px;height:3px;width:0;background:var(--accent);transition:width .9s ease}
.cell.on::after{width:100%}
.title::after{width:100%;height:2px;background:var(--ink)}
.title h1{margin:0;font-weight:800;font-size:clamp(16px,1.5vw,23px);letter-spacing:.02em;line-height:1.1;white-space:nowrap}
.title h1 .zh{font-family:var(--cjk);font-weight:700;letter-spacing:.04em}
.title p{margin:5px 0 0;font-size:8.5px;letter-spacing:.14em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title p b{color:var(--ink2);font-weight:500;font-variant-numeric:tabular-nums}
.stat .k{display:block;font-size:8px;letter-spacing:.16em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .k i{font-style:normal;font-family:var(--cjk);letter-spacing:.04em;margin-left:5px}
.stat .v{display:block;margin-top:6px;font-size:clamp(13px,1.05vw,16px);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{color:var(--mute);font-size:.78em}
.ctls{position:absolute;z-index:4;top:14px;right:14px;display:flex;gap:6px}
.btn{font:inherit;font-size:10px;letter-spacing:.1em;color:var(--ink);background:transparent;border:1px solid var(--mute);padding:5px 10px;cursor:pointer;white-space:nowrap;font-family:var(--cjk)}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible,.tab:focus-visible,.sw:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
/* 项目选择浮层（设置按钮）：多项目快照 data/<id>.json，选择记在 localStorage */
.proj-pop{position:absolute;z-index:6;right:14px;top:40px;width:264px;background:var(--bg);border:1px solid var(--ink);box-shadow:0 10px 28px rgba(0,0,0,.22);padding:8px 10px}
.pp-h{font-size:9px;letter-spacing:.14em;color:var(--mute);font-family:var(--cjk);margin-bottom:6px}
.pp-list{max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.pp-item{border:1px solid var(--hair);padding:4px 7px;cursor:pointer;font-family:var(--cjk)}
.pp-item:hover{border-color:var(--ink)}
.pp-item.on{background:var(--ink);color:var(--chip-fg);border-color:var(--ink)}
.pp-item b{display:block;font-size:9px}
.pp-item span{display:block;font-size:7.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-item.on span{color:var(--chip-fg);opacity:.75}
.pp-f{margin-top:6px;font-size:7.5px;color:var(--mute);font-family:var(--cjk)}

/* 舞台 */
.stage{position:relative;min-height:0;overflow:hidden;background:var(--bg)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,var(--scan) 0 1px,transparent 1px 3px)}
.note{position:absolute;z-index:2;right:14px;bottom:14px;display:grid;gap:4px;min-width:220px;border-left:2px solid var(--ink);padding:4px 4px 4px 12px;pointer-events:none;text-shadow:0 0 2px var(--bg),0 0 6px var(--bg),0 0 12px var(--bg)}
.note .nh{font-size:8px;letter-spacing:.14em;color:var(--mute);border-bottom:1px solid var(--hair);padding-bottom:5px;white-space:nowrap}
.note b{font-size:12.5px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums;font-family:var(--font);white-space:nowrap}
.note .ns{font-size:9px;color:var(--mute);font-family:var(--cjk)}
.hud{position:absolute;z-index:2;right:14px;bottom:96px;display:grid;gap:3px;border-left:2px solid var(--ink);padding:3px 4px 3px 12px;font-size:8.5px;letter-spacing:.1em;color:var(--mute);white-space:nowrap;pointer-events:none;text-shadow:0 0 2px var(--bg),0 0 6px var(--bg),0 0 12px var(--bg)}
.hud b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.hud .warn{color:var(--accent);font-weight:700}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--panel);border:1px solid var(--ink);padding:6px 9px;font-size:10.5px;line-height:1.55;font-family:var(--cjk);max-width:250px}
.tip b{font-family:var(--font);font-weight:700;margin-right:6px}
.tip span{display:block;color:var(--mute);font-family:var(--font);font-size:9px}

/* 面板 */
.panels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
/* 活动热力图（数字汇报 · 第一步）：单项目，行 = 仓库（git 提交次数）。分前后端 → 行成对（前N/后N），只显示完整对、最多 2 对；
   不分前后端 → 最多 3 行；多余的不显示（脚注提示共/显示行数）。小方块固定尺寸（不上下拉伸），行自然堆叠。缺数据如实显示。 */
.hm{display:flex;flex-direction:column;gap:4px;height:100%;font-size:8px}
.hrow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:6px}
.hname{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;align-self:center}
.hcells{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:2px;min-width:0}
.hm .c{aspect-ratio:1;border:1px solid var(--hair2)}
.hm .c.l1{background:color-mix(in srgb,var(--ink) 15%,transparent);border-color:transparent}
.hm .c.l2{background:color-mix(in srgb,var(--ink) 36%,transparent);border-color:transparent}
.hm .c.l3{background:color-mix(in srgb,var(--ink) 62%,transparent);border-color:transparent}
.hm .c.l4{background:color-mix(in srgb,var(--ink) 88%,transparent);border-color:transparent}
.hm .c.na{border:1px dashed var(--mute);background:transparent}
.hleg{display:flex;align-items:center;gap:4px;margin-top:auto;color:var(--mute);letter-spacing:.06em}
.hleg .hcnt{margin-left:auto}
.hleg .c{width:8px;height:8px;flex:none}
.panel{min-width:0;height:184px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--hair);padding:9px 11px 8px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;min-width:0}
.ph h2{margin:0;font-size:9px;font-weight:800;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ph h2 i{font-style:normal;font-family:var(--cjk);font-weight:500;color:var(--mute);letter-spacing:.06em;margin-left:6px}
.ph span{font-size:8.5px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.pb{flex:1;min-height:0;position:relative;overflow:hidden}
.pf{margin-top:6px;font-size:8px;letter-spacing:.1em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  name: CONFIG.taskNames[(R() * CONFIG.taskNames.length) | 0], wf: (R() * NW) | 0, prog: 0, state: 'queued', agent: -1}));
const agents = CONFIG.agents.map(([code, name], i) => ({i, code, name, task: -1}));
const wfs = CONFIG.workflows.map((name, i) => ({i, id: 'W' + pad2(i + 1), name, q: 0, cells: Array.from({length: 16}, () => R())}));
[0.91, 0.86, 0.72, 0.88, 0.84].forEach((q, i) => wfs[i].q = q);
const order = tasks.map(t => t.i);
for (let i = order.length - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; [order[i], order[j]] = [order[j], order[i]]; }
order.slice(0, 22).forEach(i => { tasks[i].state = 'done'; tasks[i].prog = 1; });
order.slice(22, 32).forEach((i, k) => { const t = tasks[i]; t.state = 'run'; t.prog = 0.06 + R() * 0.85; t.agent = k; agents[k].task = i; });

const running = () => agents.filter(a => a.task >= 0).length;

let logN = 38;

order.slice(8, 20).forEach((i, k) => log(['read', 'build', 'check', 'review'][k % 4], tasks[i]));

function step(){
  for (const a of agents) {
    if (a.task < 0) continue;
    const t = tasks[a.task];
    t.prog = Math.min(1, t.prog + 0.03 + Math.random() * 0.08);
    if (t.prog >= 1) { t.state = 'done'; t.agent = -1; a.task = -1; log(Math.random() < 0.5 ? 'check' : 'review', t); }
  }
  for (const a of agents) {
    if (a.task >= 0 || Math.random() > 0.4) continue;
    const q = tasks.filter(t => t.state === 'queued');
    if (!q.length) break;
    const t = q[(Math.random() * q.length) | 0];
    t.state = 'run'; t.agent = a.i; t.prog = 0.02; a.task = t.i; log(Math.random() < 0.5 ? 'read' : 'build', t);
  }
  const done = tasks.filter(t => t.state === 'done');
  if (done.length > 54) for (let k = 0; k < 18; k++) { const t = done[(Math.random() * done.length) | 0]; t.state = 'queued'; t.prog = 0; }
  const w = wfs[(Math.random() * NW) | 0];
  w.q = Math.max(0.6, Math.min(0.97, w.q + (Math.random() - 0.38) * 0.05));
  w.cells[(Math.random() * 16) | 0] = Math.random();
  renderAll();
}

   不分前后端 → 最多 3 行；多余的不显示（脚注提示共/显示行数）；小方块固定尺寸，不上下拉伸。 */
function heatRow(seed){
  const out = [];
  for (let d = 0; d < 30; d++){
    const x = Math.abs(Math.sin(seed * 37.7 + d * 12.9)) % 1;
    out.push(x > .82 ? 4 : x > .6 ? 3 : x > .38 ? 2 : x > .15 ? 1 : 0);
  }
  return out;
}

  {label: '前端 1', side: 'f', v: heatRow(2)},
  {label: '后端 1', side: 'b', v: heatRow(3)},
  {label: '前端 2', side: 'f', v: heatRow(4)},
  {label: '后端 2', side: 'b', v: heatRow(5)},
  {label: '前端 3', side: 'f', v: heatRow(6)}    // 孤行（无配对后端）：按规则不显示
];

function heatVisible(rows){
  if (!rows.some(r => r.side)) return rows.slice(0, 3);    // 不分前后端：最多 3 行
  const out = [];
  for (let i = 0; i + 1 < rows.length; i += 2){

  }
  return out.slice(0, 4);                                  // 前后端：最多 2 对（4 行）
}

const stage = $('#stage'), sc = $('#sc'), sctx = sc.getContext('2d'), tip = $('#tip');
let W = 1, H = 1, DPR = 1, G = null, layThreads = null, layRing = null;
let hubs = [], pulses = [], blocks = [], streaks = [], blockFS = 8, blockLH = 11;
let hoverHub = -1, needs = true, stageDirty = true;
const hubWf = [0, 1, 2], hubCh = [-10, -10, -10];   // 三个汇聚节点当前对应的任务类（W01–W05）、上次切换时间
let hubTurn = 0;
const ax = (Rr, y) => G.cx + Math.sqrt(Math.max(0, Rr * Rr - (y - G.cy) * (y - G.cy)));
const visAng = (Rr, pad) => Math.asin(Math.min(1, (Math.max(G.cy, H - G.cy) + pad) / Rr));
function mkLayer(){ const cv = document.createElement('canvas'); cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); const c = cv.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0); return [cv, c]; }
function bloom(cv, c, amount){
  if (!T.dark || typeof c.filter !== 'string') return;
  const g = document.createElement('canvas'); g.width = cv.width; g.height = cv.height;
  const gc = g.getContext('2d'); gc.filter = `blur(${3 * DPR}px)`; gc.drawImage(cv, 0, 0);
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'lighter'; c.globalAlpha = amount; c.drawImage(g, 0, 0); c.restore();
}

function layoutStage(){
  const r = sc.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  sc.width = Math.round(W * DPR); sc.height = Math.round(H * DPR);
  const narrow = W < 700;
  const R1 = narrow ? Math.max(H * 0.8, W * 0.85) : Math.max(H * 0.72, W * 0.24);
  const cx = W * (narrow ? 0.36 : 0.40) - R1;
  G = {cx, cy: H * 0.5 + (narrow ? 70 : 22), R1, R2: R1 + W * (narrow ? 0.26 : 0.22), narrow};
  buildStreaks(); buildThreads(); buildRing(); buildBlocks();
}

/* --- 飞轮谱线：整圈生成，每帧只画可见扇区 --- */
function buildStreaks(){
  const rr = mulberry32(5), thVis = visAng(G.R2, 30);
  const density = (G.narrow ? 420 : 1100) / (2 * thVis);
  streaks = [];
  const mk = (th, Lc, hot) => {
    const s = {th: ((th % TAU) + TAU) % TAU, off: 20 + rr() * 4, f: Lc * (0.7 + rr() * 0.42), b: (rr() * 4) | 0, hot, d: []};
    const nd = rr() < 0.42 ? 1 + ((rr() * 2) | 0) : 0;
    for (let i = 0; i < nd; i++) s.d.push({p: rr() * 0.92, len: 4 + rr() * 34, v: 0});
    if (rr() < 0.3) s.d.push({p: rr(), len: 5 + rr() * 20, v: 0.05 + rr() * 0.22});
    streaks.push(s);
  };
  let a = 0;
  while (a < TAU) {
    const spread = 0.008 + rr() * 0.045, n = Math.round(spread * 2 * density * (0.6 + rr() * 0.9));
    const Lc = 0.28 + rr() * 0.72, hot = rr() < 0.14;
    for (let j = 0; j < n; j++) mk(a + (rr() * 2 - 1) * spread, Lc, hot);
    a += spread * 2 + rr() * 0.05;
  }
  const nl = Math.round(density * 0.25 * TAU);
  for (let j = 0; j < nl; j++) mk(rr() * TAU, 0.15 + rr() * 0.85, false);
}

function buildThreads(){
  const [cv, c] = mkLayer(), rr = mulberry32(99), {cx, cy, R1, narrow} = G;
  const k = narrow ? 0.5 : 1, A = T.dark ? 1.3 : 1;
  const inner = y => ax(R1, y);
  const rp = (padR = 8) => { const y = rr() * H; return [rr() * Math.max(10, inner(y) - padR), y]; };
  c.save(); c.beginPath(); c.arc(cx, cy, R1 - 1, 0, TAU); c.clip();
  c.lineCap = 'round'; c.strokeStyle = T.line;
  for (let i = 0; i < Math.round(360 * k); i++) {
    const [x1, y1] = rp(), [x2, y2] = rp();
    c.globalAlpha = Math.min(1, (0.05 + rr() * 0.2) * A); c.lineWidth = 0.45 + rr() * 0.5;
    c.beginPath(); c.moveTo(x1, y1); c.quadraticCurveTo((x1 + x2) / 2 + (rr() - 0.5) * 90, (y1 + y2) / 2 + (rr() - 0.5) * 90, x2, y2); c.stroke();
  }
  for (let i = 0; i < Math.round(22 * k); i++) {
    const rad = 200 + rr() * 900, a0 = rr() * TAU;
    c.globalAlpha = (0.08 + rr() * 0.16) * A; c.lineWidth = 0.6;
    c.beginPath(); c.arc(rr() * W * 0.4 - rad * 0.3, rr() * H, rad, a0, a0 + 0.3 + rr() * 0.8); c.stroke();
  }
  hubs = [];
  (narrow ? [-0.2, 0.07, 0.3] : [-0.33, 0.01, 0.34]).forEach((off, h) => {
    const y = cy + H * off, x = inner(y) - 3, hub = {x, y, curves: [], wf: [0, 1, 2][h]};
    const n = Math.round((narrow ? 40 : 80) + rr() * 30);
    for (let i = 0; i < n; i++) {
      const sy = y + (rr() - 0.5) * H * 1.1, sx = rr() * Math.max(20, x - 60);
      const q = {x1: sx, y1: sy, cx: x - (x - sx) * (0.18 + rr() * 0.25), cy: y + (sy - y) * (0.02 + rr() * 0.18), x2: x, y2: y + (rr() - 0.5) * 3};
      hub.curves.push(q);
      c.strokeStyle = T.dark && rr() < 0.22 ? T.hi : T.line;
      c.globalAlpha = Math.min(1, (0.14 + rr() * 0.5) * A); c.lineWidth = 0.45 + rr() * 0.7; qd(c, q);
    }
    c.strokeStyle = T.dark ? T.hi : T.line; c.globalAlpha = 1; c.lineWidth = 3.2;
    c.beginPath(); c.moveTo(x - 16, y); c.lineTo(x + 1, y); c.stroke();
    hubs.push(hub);
  });
  c.strokeStyle = T.line; c.fillStyle = T.line; c.lineWidth = 0.8;
  for (let i = 0; i < Math.round(28 * k); i++) { const [x, y] = rp(20), s = 3 + rr() * 3; c.globalAlpha = 0.7 * A; c.strokeRect(x - s / 2, y - s / 2, s, s); }
  for (let i = 0; i < Math.round(14 * k); i++) { const [x, y] = rp(20); c.globalAlpha = 0.6 * A; c.beginPath(); c.arc(x, y, 2.5 + rr() * 6, 0, TAU); c.stroke(); }
  for (let i = 0; i < Math.round(16 * k); i++) { const [x, y] = rp(20); c.globalAlpha = 0.85; c.beginPath(); c.arc(x, y, 1.4 + rr() * 1.6, 0, TAU); c.fill(); }
  c.lineWidth = 1.6;
  for (let i = 0; i < Math.round(26 * k); i++) { const [x, y] = rp(20), a = rr() * TAU, l = 5 + rr() * 9; c.globalAlpha = 0.8; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke(); }
  { const [x, y] = rp(130); c.lineWidth = 0.9; c.globalAlpha = 0.75; for (let i = 0; i < 6; i++) { c.beginPath(); c.arc(x + i * 15, y - i * 4, 3.2, 0, TAU); c.stroke(); } }
  c.restore();
  c.globalAlpha = 1;
  bloom(cv, c, 0.55);
  layThreads = cv;
  pulses = Array.from({length: narrow ? 14 : 34}, () => newPulse(true));
}
function newPulse(rand){ const h = hubs[(Math.random() * hubs.length) | 0]; return {q: h.curves[(Math.random() * h.curves.length) | 0], u: rand ? Math.random() : 0, v: 0.16 + Math.random() * 0.34}; }

/* --- 环带底板：只放不转的部分（底色、两条弧、节点标签） --- */
function buildRing(){
  const [cv, c] = mkLayer(), {cx, cy, R1, R2, narrow} = G, half = Math.PI / 2;
  c.beginPath(); c.arc(cx, cy, R2, 0, TAU); c.arc(cx, cy, R1, 0, TAU, true); c.fillStyle = T.band; c.fill();
  c.strokeStyle = T.line;
  if (T.dark) { c.globalAlpha = 0.18; c.lineWidth = 5; c.beginPath(); c.arc(cx, cy, R2, -half, half); c.stroke(); c.beginPath(); c.arc(cx, cy, R1, -half, half); c.stroke(); }
  c.globalAlpha = T.dark ? 0.95 : 0.85; c.lineWidth = 1.1;
  c.beginPath(); c.arc(cx, cy, R1, -half, half); c.stroke();
  c.beginPath(); c.arc(cx, cy, R2, -half, half); c.stroke();
  c.globalAlpha = 0.3; c.lineWidth = 0.7; c.beginPath(); c.arc(cx, cy, R2 - 7, -half, half); c.stroke();
  c.globalAlpha = 1;
  layRing = cv;
}

/* --- 环带数据块：整圈排布，随飞轮一起转，文字沿半径方向 --- */
function buildBlocks(){
  blocks = [];
  blockFS = G.narrow ? 5.8 : 8.8; blockLH = blockFS * 1.34;
  for (const col of (G.narrow ? [0] : [0, 1])) {
    const rr = mulberry32(11 + col * 97);
    const types = col ? ['table', 'grid', 'bars', 'table', 'tag'] : ['code', 'table', 'bars', 'code', 'tag', 'code'];
    let th = rr() * 0.05;
    while (th < TAU - 0.06) {

function drawBlocks(c, t){

/* --- 飞轮刻度与秒标，跟着转 --- */
function drawWheelMarks(c, t){

     转过参考位（角度 0）时数值 = 当时的真实秒数；相邻标记间隔 SEC_STEP 秒（角距 = SPIN×SEC_STEP 弧度），

/* --- 飞轮谱线：基础细线 + 荧光扇区 + 滑动亮段 --- */
const BA = [0.09, 0.17, 0.27, 0.4];

}

/* --- 扫光：一道光束绕圆心快速扫过飞轮 --- */
function drawBeam(c, t){

/* --- 齿环：外圈反向快转、内圈反向慢转 --- */
function drawGears(c, t){

   多项目各一份快照（data/<id>.json），「设置」按钮选项目后按项目统计，选择记在 localStorage。 */
const projPop = $('#projPop'), projList = projPop.querySelector('.pp-list');
const monFoot = mon.querySelector('.pf'), monTpsFoot = [...mon.querySelectorAll('.tps-foot span')];
const monReqN = [...mon.querySelectorAll('.view[data-v="1"] .tile .n')], monReqRate = [...mon.querySelectorAll('.view[data-v="1"] .kv b')];
const monReqBar = mon.querySelector('.view[data-v="1"] .bar i'), monUse = [...mon.querySelectorAll('.view[data-v="2"] .use-row b')];
let tokMode = 'demo', tokSnaps = [];
function nv(el, text, na){ el.textContent = text; el.classList.toggle('na', !!na); }
function kfmt(n){ return n >= 10000 ? Math.round(n / 1000) + 'k' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); }
function paintTokens(tk){
  const tps = tk.tps || {}, req = tk.requests || {}, ses = tk.session || {}, tod = tk.today || {};
  nv(tpsNum, tps.now == null ? '—' : String(tps.now), tps.now == null);
  const series = (tps.series || []).slice(-26);
  tpsBars.innerHTML = series.map(v => `<i style="height:${Math.min(96, 14 + v * 0.3)}px" class="${v < 60 ? 'low' : ''}"></i>`).join('');
  nv(monTpsFoot[0], '峰值 ' + (tps.peak30s == null ? '—' : tps.peak30s), tps.peak30s == null);
  nv(monTpsFoot[1], '均值 ' + (tps.avg30s == null ? '—' : tps.avg30s), tps.avg30s == null);
  const rq = [req.total, req.ok, req.failed, req.retried];
  monReqN.forEach((el, i) => nv(el, rq[i] == null ? '—' : String(rq[i]), rq[i] == null));
  nv(monReqRate[0], req.cacheHitRate == null ? '—' : Math.round(req.cacheHitRate * 100) + '%', req.cacheHitRate == null);
  nv(monReqRate[1], req.successRateToday == null ? '—' : (req.successRateToday * 100).toFixed(1) + '%', req.successRateToday == null);
  monReqBar.style.width = req.cacheHitRate == null ? '0' : Math.round(req.cacheHitRate * 100) + '%';
  // 合计 = 输入 + 输出（输入已含缓存，采集器口径见 collect_tokens.py）
  const inOut = b => (b.input == null || b.output == null) ? '—' : kfmt(b.input) + ' / ' + kfmt(b.output);
  const sum = b => (b.input == null || b.output == null) ? '—' : kfmt(b.input + b.output);
  nv(monUse[0], inOut(ses), ses.input == null || ses.output == null);
  nv(monUse[1], sum(ses), ses.input == null || ses.output == null);
  nv(monUse[2], inOut(tod), tod.input == null || tod.output == null);
  const hit = (tod.input && tod.cacheRead != null) ? ' · ' + Math.round(tod.cacheRead / tod.input * 100) + '%' : ' · —';
  nv(monUse[3], sum(tod) + hit, tod.input == null || tod.output == null);
}
function bySync(a, b){ return String(b.tokens.lastSync || '').localeCompare(String(a.tokens.lastSync || '')); }
function curSnap(){
  let id = null;
  try { id = localStorage.getItem('ops-proj'); } catch (e) { /* 隐私模式等拿不到 storage */ }
  return tokSnaps.find(s => (s.project || {}).id === id) || [...tokSnaps].sort(bySync)[0];
}
function renderProjList(){
  if (!tokSnaps.length) {
    projList.innerHTML = '<div class="pp-item na">暂无 tokens 快照 · 先跑 py tools/collect_tokens.py --all</div>';
    return;
  }
  const curId = (curSnap().project || {}).id;
  projList.innerHTML = [...tokSnaps].sort(bySync).map(s => {
    const p = s.project || {}, t = s.tokens || {}, rq = t.requests || {};
    return `<div class="pp-item${p.id === curId ? ' on' : ''}" data-id="${p.id || ''}">`
      + `<b>${p.name || p.id || '?'}</b><span>${p.path || ''}</span>`
      + `<span>今日请求 ${rq.total == null ? '—' : rq.total} · lastSync ${t.lastSync || '—'}</span></div>`;
  }).join('');
}
function applySel(){
  const s = curSnap();
  if (!s) { renderProjList(); return; }
  tokMode = 'live';
  paintTokens(s.tokens);
  monFoot.textContent = '数据同步 · ' + ((s.project || {}).name || '?') + ' · lastSync ' + (s.tokens.lastSync || '—') + ' · 每 60 秒刷新';
  renderProjList();
}
projList.addEventListener('click', e => {
  const it = e.target.closest('.pp-item[data-id]');
  if (!it) return;
  try { localStorage.setItem('ops-proj', it.dataset.id); } catch (err) { /* 拿不到 storage 就只本次生效 */ }
  applySel();
  projPop.hidden = true;
});
projBtn.addEventListener('click', () => { projPop.hidden = !projPop.hidden; renderProjList(); });
document.addEventListener('pointerdown', e => {
  if (!projPop.hidden && !projPop.contains(e.target) && !projBtn.contains(e.target)) projPop.hidden = true;
});
async function syncTokens(){
  let snaps;
  try {
    const dir = await fetch('data/');
    if (!dir.ok) return;
    const names = [...(await dir.text()).matchAll(/href="([^"]+\.json)"/g)]
      .map(m => m[1].split('/').pop()).filter(n => n && !n.startsWith('_'));
    snaps = (await Promise.all(names.map(n => fetch('data/' + n)
      .then(r => r.ok ? r.json() : null).catch(() => null)))).filter(Boolean);
  } catch (e) { return; }   // file:// 或无 data/：保持演示（模拟数据）
  tokSnaps = snaps.filter(s => s.tokens);
  if (tokSnaps.length) { applySel(); }
  else if (snaps.length) {
    tokMode = 'none';
    paintTokens({});
    monFoot.textContent = '未接入 · 快照中无 tokens 节 · 缺数据如实显示';
    renderProjList();
  }
}
syncTokens();
setInterval(() => { if (!paused && !host.hidden) syncTokens(); }, 60000);

/* ================= 7. 主循环与控制 ================= */
let simT = 0, last = performance.now(), paused = false;
fullBtn.addEventListener('click', () => {
  const el = document.documentElement;
  try {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => { fullBtn.textContent = '不支持'; setTimeout(() => fullBtn.textContent = '全屏', 1500); });
  } catch (e) { /* 部分窗口不允许全屏 */ }
});
document.addEventListener('fullscreenchange', () => { fullBtn.textContent = document.fullscreenElement ? '退出全屏' : '全屏'; });
themeBtn.addEventListener('click', () => { const i = THEMES.findIndex(([id]) => id === curTheme()); root.dataset.theme = THEMES[(i + 1) % THEMES.length][0]; });
function onTheme(){ readTheme(); stageDirty = true; }
new MutationObserver(onTheme).observe(root, {attributes: true, attributeFilter: ['data-theme']});
darkMQ.addEventListener('change', onTheme);

function frame(now){
  requestAnimationFrame(frame);
  if (host.hidden) { last = now; return; }
  const real = Math.min(0.05, (now - last) / 1000); last = now;
  const dt = paused ? 0 : real; simT += dt;
  try {
    if (stageDirty) { layoutStage(); stageDirty = false; needs = true; }
    if (dt > 0 || needs) { drawStage(simT, dt); needs = false; }
  } catch (err) { console.error(err); }
}

function hudTick(){
  // 原粒子求解器退役后，稳定性读数由模拟波动驱动（示例数据）
  const cfl = 0.42 + 0.35 * Math.abs(Math.sin(simT * 0.21)) + Math.random() * 0.04, bad = cfl > 1;
  $('#cfl').textContent = cfl.toFixed(2);
  const st = $('#cflst'); st.textContent = bad ? 'OVER · 步长减半' : 'OK'; st.className = bad ? 'warn' : '';
}
function clockTick(){ $('#clock').textContent = hms(new Date()); }
let hiIdx = 1; const cells = [...SR.querySelectorAll('.stat')];
function cycleHi(){ cells.forEach((el, i) => el.classList.toggle('on', i === hiIdx)); hiIdx = (hiIdx + 1) % cells.length; }

const ro = new ResizeObserver(() => { stageDirty = true; renderFeed(); needs = true; });
ro.observe(stage);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { stageDirty = true; });

readTheme();
renderAll(); renderHeat(); renderAct();
clockTick(); cycleHi();
setInterval(() => { if (!paused && !host.hidden) step(); }, 900);
setInterval(() => { if (!paused && !host.hidden) hudTick(); }, 300);
setInterval(clockTick, 1000);
setInterval(() => { if (!paused && !host.hidden) cycleHi(); }, 4500);
setInterval(() => { if (!paused && !host.hidden) switchHub(); }, 2400);
setInterval(() => { if (!paused && !host.hidden) actTick(); }, 34);
setTimeout(hudTick, 500);
requestAnimationFrame(frame);
}

/* ================= 外壳：挂载调度中心大屏 ================= */
(() => {
  'use strict';
  const host = document.getElementById('host-ops');
  const SR = host.attachShadow({mode: 'open'});
  SR.appendChild(document.getElementById('tpl-ops').content.cloneNode(true));
  try { mountOps(host, SR); } catch (e) { console.error(e); }
})();
</script>
